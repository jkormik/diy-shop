{% extends 'base.html' %}

{% block title %}Избранное | Handmade Soul{% endblock %}

{% block content %}
<section class="py-20 max-w-7xl mx-auto px-4">
    <h1 class="text-4xl font-serif text-stone-800 mb-12 text-center">Избранное</h1>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
        {% for favorite in favorites %}
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow duration-300">
            <div class="aspect-[4/5] overflow-hidden relative group">
                <img src="{{ favorite.product.image.url }}" alt="{{ favorite.product.name }}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                <button onclick="toggleFavorite({{ favorite.product.id }}, this)" class="absolute top-4 right-4 w-8 h-8 bg-white/80 backdrop-blur-sm rounded-full flex items-center justify-center text-red-500">
                    <i class="fa-solid fa-heart"></i>
                </button>
            </div>
            <div class="p-5">
                <h3 class="font-medium text-stone-800 mb-1">{{ favorite.product.name }}</h3>
                <div class="flex justify-between items-center">
                    <span class="text-lg font-serif text-stone-600">₽{{ favorite.product.price }}</span>
                    <button onclick="toggleCart({{ favorite.product.id }}, this)" 
                            class="px-4 py-2 rounded-full text-xs transition-colors {% if favorite.product.id in cart_products %}bg-stone-300 text-stone-600{% else %}bg-stone-800 text-white{% endif %}">
                        {% if favorite.product.id in cart_products %}Убрать из корзины{% else %}В корзину{% endif %}
                    </button>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-span-full text-center py-20">
            <i class="fa-regular fa-heart text-6xl text-stone-200 mb-4 block"></i>
            <p class="text-stone-500 text-xl mb-8">Ваш список избранного пуст</p>
            <a href="{% url 'product_list' %}" class="px-8 py-3 bg-stone-800 text-white rounded-full hover:bg-stone-700 transition-all">
                Найти вдохновение
            </a>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
