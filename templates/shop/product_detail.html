{% extends 'base.html' %}

{% block title %}{{ product.name }} | Handmade Soul{% endblock %}

{% block content %}
<section class="py-20 max-w-7xl mx-auto px-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
        <!-- Product Images -->
        <div class="space-y-6">
            <div class="aspect-[4/5] overflow-hidden rounded-3xl bg-stone-200 shadow-[0_4px_20px_rgba(0,0,0,0.05)]">
                <img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy" class="w-full h-full object-cover">
            </div>
            <div class="grid grid-cols-4 gap-4">
                <div class="aspect-square rounded-2xl bg-stone-200 overflow-hidden cursor-pointer hover:opacity-80 transition-all duration-300 hover:-translate-y-1 shadow-sm">
                    <img src="{{ product.image.url }}" alt="view 1" loading="lazy" class="w-full h-full object-cover">
                </div>
                <div class="aspect-square rounded-2xl bg-stone-200 overflow-hidden cursor-pointer hover:opacity-80 transition-all duration-300 hover:-translate-y-1 shadow-sm">
                    <img src="{{ product.image.url }}" alt="view 2" loading="lazy" class="w-full h-full object-cover">
                </div>
                <div class="aspect-square rounded-2xl bg-stone-200 overflow-hidden cursor-pointer hover:opacity-80 transition-all duration-300 hover:-translate-y-1 shadow-sm">
                    <img src="{{ product.image.url }}" alt="view 3" loading="lazy" class="w-full h-full object-cover">
                </div>
                <div class="aspect-square rounded-2xl bg-stone-200 overflow-hidden cursor-pointer hover:opacity-80 transition-all duration-300 hover:-translate-y-1 shadow-sm">
                    <img src="{{ product.image.url }}" alt="view 4" loading="lazy" class="w-full h-full object-cover">
                </div>
            </div>
        </div>

        <!-- Product Info -->
        <div class="flex flex-col justify-center">
            <div class="mb-6">
                <a href="{% url 'product_list' %}?category={{ product.category.slug }}" class="text-sm text-stone-400 hover:text-stone-800 transition-colors">
                    {{ product.category.name }} <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
                </a>
                <h1 class="text-4xl font-serif text-stone-800 mt-2">{{ product.name }}</h1>
            </div>

            <div class="text-3xl font-serif text-stone-600 mb-8">₽{{ product.price }}</div>

            <p class="text-lg text-stone-600 mb-10 leading-relaxed">
                {{ product.description }}
            </p>

            <div class="space-y-6">
                <!-- Actions -->
                <div class="flex gap-4 pt-8">
                    <button onclick="toggleCart({{ product.id }}, this)" 
                            class="flex-1 inline-flex justify-center items-center px-8 py-4 rounded-full transition-all duration-300 font-medium hover:-translate-y-0.5 {% if product.id in cart_products %}bg-stone-300 text-stone-600{% else %}bg-stone-800 text-white hover:bg-stone-700{% endif %}">
                        {% if product.id in cart_products %}Убрать из корзины{% else %}Добавить в корзину{% endif %}
                    </button>
                    <button onclick="toggleFavorite({{ product.id }}, this)" class="w-14 h-14 flex items-center justify-center rounded-full border border-stone-200 {% if product.id in favorite_products %}text-red-500 border-red-200{% else %}text-stone-400 hover:text-red-400 hover:border-red-200{% endif %} transition-all">
                        <i class="{% if product.id in favorite_products %}fa-solid{% else %}fa-regular{% endif %} fa-heart text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- Shipping info -->
            <div class="mt-12 pt-12 border-t border-stone-200 space-y-4">
                <div class="flex items-center space-x-4 text-stone-500 text-sm">
                    <i class="fa-solid fa-truck w-5 text-center"></i>
                    <span>Доставка по всей стране (3-7 дней)</span>
                </div>
                <div class="flex items-center space-x-4 text-stone-500 text-sm">
                    <i class="fa-solid fa-shield-heart w-5 text-center"></i>
                    <span>100% гарантия качества ручной работы</span>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
